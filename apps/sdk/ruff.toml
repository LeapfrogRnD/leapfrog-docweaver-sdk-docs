# Ruff configuration
line-length = 88
indent-width = 4
target-version = "py312"

[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# Plus additional useful rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "I",      # isort
    "N",      # pep8-naming
    "C4",     # flake8-comprehensions
    "ICN",    # flake8-import-conventions
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLOT",   # flake8-slots
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # line too long, handled by formatter
    "W191",   # indentation contains tabs
    "E111",   # indentation is not a multiple of four
    "E114",   # indentation is not a multiple of four (comment)
    "E117",   # over-indented
    "D",      # pydocstyle
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    "Q000",   # bad-quotes-inline-string
    "Q001",   # bad-quotes-multiline-string
    "Q002",   # bad-quotes-docstring
    "Q003",   # avoidable-escaped-quote
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Allow fix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
]

[lint.per-file-ignores]
# =============================================================================
# TEST FILES: Relaxed rules for test code
# =============================================================================
# Tests can use magic values, assertions, and relaxed naming for clarity
"**/tests/**/*.py" = [
    # Test data and assertions
    "PLR2004",  # Magic value used in comparison (test data is often literal)
    "S101",     # Use of assert detected (required for pytest)

    # Test-specific patterns
    "PT011",    # pytest.raises() too broad (TODO: Add match= parameters gradually)
    "PT018",    # Composite assertion (sometimes clearer in tests)

    # Naming conventions (Pydantic Model pattern in tests)
    "N806",     # Variable in function should be lowercase (Model = create_model())
    "N802",     # Function name should be lowercase (test_minItems_constraint)

    # Imports (scoped test imports are acceptable)
    "PLC0415",  # Import outside top-level (conditional test imports are ok)

    # Documentation and examples
    "ERA001",   # Commented-out code (often used for examples in tests)
    "W505",     # Doc line too long (test docstrings can be descriptive)

    # Exception handling (tests can be less strict)
    "TRY003",   # Avoid specifying long messages outside exception class

    # Other test-specific allowances
    "ARG001",   # Unused function argument (pytest fixtures)
    "ARG002",   # Unused method argument
]

# =============================================================================
# INIT FILES: Allow re-exports
# =============================================================================
"**/__init__.py" = [
    "F401",     # Imported but unused (re-exports)
    "F403",     # Star imports (used for __all__)
    "E402",     # Module level import not at top of file
]

# =============================================================================
# PYDANTIC CONFIGS: Allow runtime imports needed for model building
# =============================================================================
"**/pipeline/stages/configs/llm_extraction_config.py" = [
    "TCH001",   # Move import into type-checking block (needed at runtime for Pydantic)
    "TCH002",   # Move third-party import into type-checking block (needed at runtime for Pydantic)
]

# =============================================================================
# SCRIPTS AND DRIVERS: Allow print statements
# =============================================================================
"driver.py" = [
    "T201",     # print found
    "T203",     # pprint found
]

"scripts/**/*.py" = [
    "T201",     # print found
    "T203",     # pprint found
    "INP001",   # Implicit namespace package
]

# =============================================================================
# TEMPORARY/SCRATCH CODE: Ignore all checks
# =============================================================================
# TODO: Clean up or move temp code to proper test fixtures
"**/temp/**" = ["ALL"]
"**/*scratchpad*" = ["ALL"]

# TODO: Refactor or document this legacy code
"leapx/services/layout_parser/temp/**" = ["ALL"]

[lint.isort]
known-first-party = ["leapx"]

[lint.mccabe]
# TODO: Reduce to 10 after refactoring complex functions
# Current complex functions (PLR0912 - 8 occurrences):
# - Review and refactor functions with >15 branches
max-complexity = 15

[lint.pycodestyle]
max-doc-length = 88

[lint.pydocstyle]
convention = "google"

[format]
# Like Black, use double quotes for strings
quote-style = "double"

# Like Black, indent with spaces, rather than tabs
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"

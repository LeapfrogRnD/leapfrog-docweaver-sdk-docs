[project]
name = "pipeline-mcp-server"
version = "0.1.0"
description = "MCP server for DocWeaver"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.42.94",
    "fastapi>=0.135.3",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "mangum>=0.21.0,<0.22.0",
    "python-dotenv>=1.0.1",
    "starlette>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["leap_docweaver_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

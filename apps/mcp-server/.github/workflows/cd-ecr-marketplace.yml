name: Deploy Application To ECR Marketplace

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to execute"
        required: false
        default: main

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::615854522317:role/LEAPX_BACKEND_ROLE
  MARKETPLACE_REGISTRY_ID: 709825985650
  MARKETPLACE_REGISTRY: 709825985650.dkr.ecr.us-east-1.amazonaws.com
  MARKETPLACE_MCP_SERVER_REPOSITORY: leapfrog-technology/mcp-server
jobs:
  build-and-push:
    name: Build and Push Docker Images to AWS Marketplace ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # Removed manual 'Inspect OIDC token' as it causes 401 errors 
      # by exhausting the token request in restricted environments.

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "If this runs, OIDC is working!"
          aws sts get-caller-identity

      - name: Login to AWS Marketplace ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.MARKETPLACE_REGISTRY }}

      - name: Extract image metadata
        id: meta
        run: |
          # AWS Marketplace ECR requires immutable tags - ensure uniqueness with timestamp
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          DATE=$(date -u +'%Y%m%d')
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          VERSION="${TIMESTAMP}-${SHORT_SHA}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Build and Tag Backend Docker image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker build \
            --tag ${{ env.MARKETPLACE_REGISTRY }}/${{ env.MARKETPLACE_MCP_SERVER_REPOSITORY }}:$IMAGE_TAG \
            .

      - name: Push Backend Docker image to AWS Marketplace ECR
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker push ${{ env.MARKETPLACE_REGISTRY }}/${{ env.MARKETPLACE_MCP_SERVER_REPOSITORY }}:$IMAGE_TAG

      - name: Verify Backend image push
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          echo "Verifying backend image push to AWS Marketplace ECR..."
          aws ecr describe-images \
            --registry-id ${{ env.MARKETPLACE_REGISTRY_ID }} \
            --repository-name ${{ env.MARKETPLACE_MCP_SERVER_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-ids imageTag=$IMAGE_TAG

      - name: Output image details
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          echo "✅ Successfully pushed both images to AWS Marketplace ECR:"
          echo ""
          echo "Backend Image:"
          echo "  Repository: ${{ env.MARKETPLACE_REGISTRY }}/${{ env.MARKETPLACE_MCP_SERVER_REPOSITORY }}"
          echo "  Tag: $IMAGE_TAG"
          echo "  Full URI: ${{ env.MARKETPLACE_REGISTRY }}/${{ env.MARKETPLACE_MCP_SERVER_REPOSITORY }}:$IMAGE_TAG"
          echo ""
          echo "Doc Processor Image:"
          echo "  Repository: ${{ env.MARKETPLACE_REGISTRY }}/${{ env.MARKETPLACE_DOC_PROCESSOR_REPOSITORY }}"
          echo "  Tag: $IMAGE_TAG"
          echo "  Full URI: ${{ env.MARKETPLACE_REGISTRY }}/${{ env.MARKETPLACE_DOC_PROCESSOR_REPOSITORY }}:$IMAGE_TAG"

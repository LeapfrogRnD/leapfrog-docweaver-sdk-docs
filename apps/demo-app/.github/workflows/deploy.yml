name: Deploy Frontend

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write # Required for OIDC auth with AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables (dev)
        if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: |
          echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          echo "S3_BUCKET=${{ secrets.DEV_S3_BUCKET }}" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_ENV
          echo "VITE_OCR_API_URL=${{ secrets.DEV_VITE_OCR_API_URL }}" >> $GITHUB_ENV
          echo "VITE_APP_GUIDE_URL=${{ secrets.DEV_VITE_APP_GUIDE_URL }}" >> $GITHUB_ENV
          echo "VITE_ONBOARDING_GUIDE_URL=${{ secrets.DEV_VITE_ONBOARDING_GUIDE_URL }}" >> $GITHUB_ENV

      - name: Set environment variables (prod)
        if: github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
        run: |
          echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          echo "S3_BUCKET=${{ secrets.PROD_S3_BUCKET }}" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_ENV
          echo "VITE_OCR_API_URL=${{ secrets.PROD_VITE_OCR_API_URL }}" >> $GITHUB_ENV
          echo "VITE_APP_GUIDE_URL=${{ secrets.PROD_VITE_APP_GUIDE_URL }}" >> $GITHUB_ENV
          echo "VITE_ONBOARDING_GUIDE_URL=${{ secrets.PROD_VITE_ONBOARDING_GUIDE_URL }}" >> $GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_OCR_API_URL: ${{ env.VITE_OCR_API_URL }}
          VITE_APP_GUIDE_URL: ${{ env.VITE_APP_GUIDE_URL }}
          VITE_ONBOARDING_GUIDE_URL: ${{ env.VITE_ONBOARDING_GUIDE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Summary
        run: echo "✅ Deployed to **${{ env.DEPLOY_ENV }}** environment" >> $GITHUB_STEP_SUMMARY

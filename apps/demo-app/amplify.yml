version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Ensure pnpm is available in Amplify build images
        - corepack enable
        - corepack prepare pnpm@9.15.4 --activate
        - pnpm --version
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    # Vite default output directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      # pnpm store (keeps installs fast between builds)
      - .pnpm-store/**
      - node_modules/**
      - ~/.pnpm-store/**
      - ~/.cache/pnpm/**

[project]
name = "doc-processor"
version = "0.1.0"
description = "Scalable document processing worker with DB polling and auto-scaling support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "leapx @ file:///${PROJECT_ROOT}/../leapx-0.0.1-py3-none-any.whl",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.11.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

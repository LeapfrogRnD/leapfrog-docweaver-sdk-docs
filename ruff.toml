# Ruff configuration file
# See https://docs.astral.sh/ruff/ for more information

# Set the maximum line length to 100.
line-length = 100
indent-width = 4

# Assume Python 3.12
target-version = "py312"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
    "tmp",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins (avoid shadowing builtins)
    "COM",    # flake8-commas
    "T20",    # flake8-print (catch print statements)
    "PIE",    # flake8-pie (misc lints)
    "Q",      # flake8-quotes
    "RET",    # flake8-return (return statement improvements)
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (prefer pathlib over os.path)
    "PL",     # pylint
    "TRY",    # tryceratops (exception handling best practices)
    "FLY",    # flynt (string formatting improvements)
    "PERF",   # perflint (performance anti-patterns)
    "LOG",    # flake8-logging (logging best practices)
]

# Ignore specific rules if needed
ignore = [
    "E501",   # Line too long (handled by formatter)
    "S101",   # Use of assert detected (allow asserts in code)
    "TRY003", # Avoid specifying long messages outside exception class
    "PLR0913", # Too many arguments to function call
    "COM812", # Ignore trailing commas,
    "B008",
    "PLW0603",
    "S104",
    "TRY300",
    "PLC0415"
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
known-first-party = ["backend"]

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces, rather than tabs
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending
line-ending = "auto"

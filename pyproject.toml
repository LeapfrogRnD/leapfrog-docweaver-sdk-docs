[project]
name = "leapx"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "azure-ai-documentintelligence==1.0.0b4",
    "black>=25.11.0",
    "pre-commit>=4.4.0",
    "pydantic>=2.12.4",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
    "pandas>=2.3.2,<2.4",
    "numpy>=1.26.0",
    "loguru>=0.7.0",
    "dotenv>=0.9.9",
    "instructor>=1.13.0",
    "litellm>=1.79.3",
    "boto3>=1.40.72",
    "langfuse>=3.0.0,<4.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.24.0",
    "pytest-asyncio>=1.3.0",
    "pypdf>=6.4.2",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leapx"]

[tool.hatch.build.targets.sdist]
exclude = [
    "logs/",
    ".venv/",
    ".git/",
    ".github/",
    ".vscode/",
    "examples/",
    ".leapx_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
    "dist/",
    "samples/",
    "pipeline_results/",
    "tests/",
    "scripts/",
    "*.log",
    "*.json",
    "demo.py",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
]

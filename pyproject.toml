[project]
name = "leapx_be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "leapx @ file:///${PROJECT_ROOT}/leapx-0.0.1-py3-none-any.whl",
    "boto3>=1.40.54",
    "dotenv>=0.9.9",
    "fastapi>=0.125.0",
    "openpyxl>=3.1.5",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.11.0",
    "pypdf>=6.4.2",
    "python-multipart>=0.0.21",
    "uvicorn>=0.38.0",
    "loguru>=0.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "fastapi-csrf-protect>=1.0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"

[tool.uv.workspace]
members = [
    "backend_app",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "alembic*", "doc_processor*"]
exclude = ["tmp*", "tests*", "htmlcov*"]

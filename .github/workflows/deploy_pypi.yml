name: Publish to PyPI or TestPyPI

on:
  release:
    types:
      - created

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Get version from tag
        id: version
        run: |
          RAW_REF="${GITHUB_REF##*/}"   # e.g. v1.2.3rc1
          VERSION="${RAW_REF#v}"        # strip leading v → 1.2.3rc1
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version from tag: $VERSION"

      - name: Validate tag is PEP 440-ish
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+(![0-9]+)?(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'; then
            echo "Invalid version tag: '$VERSION'. Must follow PEP 440-like pattern:"
            echo "Epoch:        v.N!"
            echo "Release:      v.N(.N)*"
            echo "Pre-release:  v.{a|b|rc}N"
            echo "Post-release: v.*.postN"
            echo "Dev-release:  v.*.devN"
            exit 1
          fi

          echo "Validated version: $VERSION"

      - name: Sync pyproject.toml version with tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "Updated pyproject.toml version to ${VERSION}"
          cat pyproject.toml | grep '^version = '

      - name: Build package
        run: python -m build

      - name: Decide target repository based on pre/dev release
        id: target
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$'; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "repository_url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
            echo "Will publish final/post-release ${VERSION} to PyPI"
          else
            # Anything else is pre-release/dev
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "repository_url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
            echo "Will publish pre/dev release ${VERSION} to TestPyPI"
          fi

      - name: Publish to (Test)PyPI
        env:
          TWINE_USERNAME: __token__
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ "${{ steps.target.outputs.is_release }}" = "true" ]; then
            echo "Publishing to PyPI..."
            TWINE_PASSWORD="$PYPI_TOKEN" twine upload \
              --repository-url https://upload.pypi.org/legacy/ \
              dist/*
          else
            echo "Publishing to TestPyPI..."
            TWINE_PASSWORD="$TEST_PYPI_TOKEN" twine upload \
              --repository-url https://test.pypi.org/legacy/ \
              dist/*
          fi
